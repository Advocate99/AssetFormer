# Decoding configuration for AssetFormer
# This file contains tokenization and decoding parameters

# Special tokens
tokens:
  eos_id: 213  # End of sequence token ID

# Token type ranges (for constrained decoding)
# Format: [start_index, count]
token_ranges:
  building_type:  # TYPE1: building class
    start: 0
    count: 25
  location_x:     # TYPE2: x coordinate
    start: 25
    count: 59
  location_y:     # TYPE3: y coordinate  
    start: 84
    count: 44
  location_z:     # TYPE4: z coordinate
    start: 128
    count: 81
  rotation_yaw:   # TYPE5: yaw rotation
    start: 209
    count: 4

# Coordinate value mappings
# These map token indices to actual coordinate values
coordinates:
  x_list: [
    -4000, -3600, -3200, -2800, -2400, -2300, -2200, -2000, -1900, -1800,
    -1700, -1600, -1500, -1400, -1300, -1200, -1100, -1000, -900, -800,
    -700, -600, -500, -400, -300, -200, -100, 0, 100, 200,
    300, 400, 500, 600, 700, 800, 900, 1000, 1100, 1200,
    1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100, 2200,
    2300, 2400, 2600, 2700, 2800, 3200, 3600, 4000, 4400
  ]
  y_list: [
    -2800, -2400, -2000, -1900, -1800, -1600, -1500, -1400, -1300, -1200,
    -1100, -1000, -900, -800, -700, -600, -500, -400, -300, -200,
    -100, 0, 100, 200, 300, 400, 500, 600, 700, 800,
    900, 1000, 1100, 1200, 1300, 1400, 1500, 1600, 1800, 1900,
    2000, 2200, 2400, 2800, 3200
  ]
  z_list: [
    0, 50, 100, 150, 200, 250, 300, 350, 400, 450,
    500, 550, 600, 650, 700, 750, 800, 850, 900, 950,
    1000, 1050, 1100, 1150, 1200, 1250, 1300, 1350, 1400, 1450,
    1500, 1550, 1600, 1650, 1700, 1750, 1800, 1850, 1900, 1950,
    2000, 2050, 2100, 2150, 2200, 2250, 2300, 2350, 2400, 2450,
    2500, 2550, 2600, 2650, 2700, 2800, 2850, 2900, 2950, 3000,
    3050, 3100, 3200, 3250, 3300, 3350, 3400, 3450, 3500, 3600,
    3650, 3700, 3800, 3850, 3900, 4000, 4050, 4100, 4200, 4300,
    4400
  ]

# Rotation mapping
rotation:
  yaw_base: -90  # base yaw angle
  yaw_step: 90   # step between yaw values
